# Composite action: runs entirely in the caller's runner (no separate Docker image).
# Sends one Discord message: a short "content" line plus an embed with repo, branch, actor, and commit info.
name: Discord deploy notification
description: Post a Discord webhook with repository, branch, actor, and commit details.

inputs:
  # Incoming Webhooks URL from Discord (Server Settings → Integrations → Webhooks).
  # Store as a secret, e.g. DISCORD_WEBHOOK_URL, and pass secrets.DISCORD_WEBHOOK_URL.
  webhook-url:
    description: Discord webhook URL (usually a repository secret).
    required: true
  # Shown as the plain-text first line above the embed (Discord "content" field).
  content:
    description: First line of the Discord message (content field).
    required: true
  # Optional; appears as the embed title (default if omitted).
  embed-title:
    description: Embed title.
    required: false
    default: "GitHub Actions notification"

runs:
  using: composite
  steps:
    - name: Send Discord notification
      shell: bash
      env:
        DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url }}
        CONTENT_LINE: ${{ inputs.content }}
        EMBED_TITLE: ${{ inputs.embed-title }}
        # github.* context: repo slug, current ref short name, who triggered the workflow.
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        # Present for push events; may be empty on workflow_dispatch or other triggers.
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.event.head_commit.url }}
      run: bash "${{ github.action_path }}/send.sh"
