name: Frontend S3 deploy
description: Download a dist artifact, sync to S3 with cache policies, and optionally invalidate CloudFront.

inputs:
  app_path:
    description: Frontend app directory (dist root parent).
    required: true
  artifact_name:
    description: Name of the uploaded dist artifact to download.
    required: true
  aws_access_key_id:
    description: AWS access key ID.
    required: true
  aws_secret_access_key:
    description: AWS secret access key.
    required: true
  aws_region:
    description: AWS region for credentials and S3/CloudFront.
    required: true
  s3_bucket:
    description: Target S3 bucket name.
    required: true
  s3_prefix:
    description: Optional key prefix inside the bucket.
    required: false
    default: ""
  cloudfront_distribution_id:
    description: CloudFront distribution ID; empty skips invalidation.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.app_path }}/dist

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}

    - name: Sync static files to S3
      shell: bash
      env:
        S3_BUCKET: ${{ inputs.s3_bucket }}
        S3_PREFIX: ${{ inputs.s3_prefix }}
        APP_PATH: ${{ inputs.app_path }}
      run: |
        set -euo pipefail
        SOURCE="${APP_PATH}/dist"
        PREFIX="${S3_PREFIX:-}"
        PREFIX="${PREFIX#/}"
        if [ -n "$PREFIX" ] && [ "${PREFIX: -1}" != "/" ]; then
          PREFIX="${PREFIX}/"
        fi
        DEST="s3://${S3_BUCKET}/${PREFIX}"
        CACHE_LONG="public,max-age=31536000,immutable"
        CACHE_SHORT="public,max-age=300,must-revalidate"

        echo "Uploading to ${DEST}"
        aws s3 sync "$SOURCE" "$DEST" --delete --only-show-errors \
          --cache-control "$CACHE_LONG" \
          --exclude "*" --include "assets/*"

        aws s3 sync "$SOURCE" "$DEST" --delete --only-show-errors \
          --cache-control "$CACHE_SHORT" \
          --exclude "assets/*"

    - name: Invalidate CloudFront cache
      if: ${{ inputs.cloudfront_distribution_id != '' }}
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
      run: |
        set -euo pipefail
        aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          --paths "/*"
